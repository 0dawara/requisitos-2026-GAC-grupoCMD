<!DOCTYPE html>
<html class="light" lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
    <title>Escanear Ativo - GAC Unifor</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#a6c8ff",
                        "on-background": "#101d25",
                        "primary": "#0037be",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "outline": "#747688",
                        "on-secondary-fixed-variant": "#2d3aa4",
                        "on-primary-fixed-variant": "#0036bb",
                        "on-secondary-fixed": "#000964",
                        "inverse-on-surface": "#e5f3ff",
                        "surface-bright": "#f5faff",
                        "inverse-surface": "#25323b",
                        "primary-fixed": "#dde1ff",
                        "surface-container-high": "#dceaf6",
                        "surface-container": "#e2f0fc",
                        "tertiary-fixed": "#d5e3ff",
                        "gelo": "#E4F2FE",
                        "on-primary-fixed": "#001354",
                        "on-tertiary-fixed-variant": "#004786",
                        "background": "#f5faff",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#001c3b",
                        "surface-container-low": "#eaf5ff",
                        "on-error-container": "#93000a",
                        "on-secondary-container": "#142290",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#c9dcff",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#2b61a2",
                        "surface-dim": "#cedce8",
                        "on-primary-container": "#d3d9ff",
                        "primary-container": "#004af7",
                        "anil": "#004AF7",
                        "surface-container-highest": "#d6e4f0",
                        "surface-tint": "#0049f4",
                        "secondary-container": "#8592ff",
                        "on-surface-variant": "#434656",
                        "azul-claro": "#87B7FE",
                        "tertiary": "#014989",
                        "surface": "#f5faff",
                        "on-surface": "#101d25",
                        "primary-fixed-dim": "#b8c4ff",
                        "on-primary": "#ffffff",
                        "marinho": "#132190",
                        "inverse-primary": "#b8c4ff",
                        "surface-variant": "#d6e4f0",
                        "secondary-fixed-dim": "#bdc2ff",
                        "error": "#ba1a1a",
                        "outline-variant": "#c3c5d9",
                        "secondary": "#4753bd",
                        "secondary-fixed": "#dfe0ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "margin-desktop": "32px",
                        "margin-mobile": "16px",
                        "container-max-width": "1280px",
                        "base": "8px",
                        "safe": "env(safe-area-inset-bottom)"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "display-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-sm-mobile": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "display-lg": ["56px", { "lineHeight": "64px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "label-sm-mobile": ["10px", { "lineHeight": "14px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "display-lg-mobile": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    },
                    "animation": {
                        "scan": "scan 2s linear infinite",
                        "pulse-soft": "pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite"
                    },
                    "keyframes": {
                        "scan": {
                            "0%": { top: "0%" },
                            "50%": { top: "100%" },
                            "100%": { top: "0%" }
                        },
                        "pulse-soft": {
                            "0%, 100%": { opacity: 1 },
                            "50%": { opacity: .7 }

                    }
                }
            }
        }
    </script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }

        /* Camera overlay simulation */
        .camera-bg {
            background-color: #000;
            position: relative;
            overflow: hidden;
        }

        .camera-blur {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10;
        }

        .viewfinder-cutout {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
            border-radius: 24px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7);
            z-index: 20;
        }

        .viewfinder-border {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
            border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            z-index: 30;
        }

        .viewfinder-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #004AF7;
            /* anil */
            border-style: solid;
            z-index: 30;
        }

        .corner-tl {
            top: -2px;
            left: -2px;
            border-width: 4px 0 0 4px;
            border-top-left-radius: 24px;
        }

        .corner-tr {
            top: -2px;
            right: -2px;
            border-width: 4px 4px 0 0;
            border-top-right-radius: 24px;
        }

        .corner-bl {
            bottom: -2px;
            left: -2px;
            border-width: 0 0 4px 4px;
            border-bottom-left-radius: 24px;
        }

        .corner-br {
            bottom: -2px;
            right: -2px;
            border-width: 0 4px 4px 0;
            border-bottom-right-radius: 24px;
        }

        .scan-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #004AF7;
            box-shadow: 0 0 8px 2px rgba(0, 74, 247, 0.5);
            z-index: 40;
            animation: scan 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
    </style>
</head>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased overflow-hidden">
    <!-- Header / Top Navigation (Mobile Optimized) -->
    <header
        class="bg-surface border-b border-azul-claro/20 flex justify-between items-center w-full px-margin-mobile h-16 sticky top-0 z-50">
        <button
            class="text-on-surface-variant hover:bg-gelo/50 p-2 rounded-full transition-colors flex items-center justify-center">
            <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
        </button>
        <h1 class="font-headline-md text-headline-md text-marinho font-bold flex-1 text-center">Escanear Ativo</h1>
        <div class="w-10 h-10 flex items-center justify-center">
            <!-- Small unifor logo placeholder text since we don't have the actual SVG -->
            <span class="font-headline-md text-headline-md font-extrabold text-marinho text-sm">GAC</span>
        </div>
    </header>
    <!-- Main Content Area - Full Screen Camera View -->
    <main class="flex-1 relative flex flex-col items-center justify-center camera-bg">
        <!-- Mock background image for camera view -->
        <div class="absolute inset-0 w-full h-full bg-cover bg-center opacity-40 grayscale"
            data-alt="A modern, brightly lit corporate office space or laboratory setting seen through a smartphone camera lens. The environment is clean, professional, and slightly out of focus, typical of an autofocusing camera view. There are indistinct shapes of office equipment, desks, and bright white lighting reflecting off metallic surfaces. The color palette leans towards cool whites, greys, and subtle blues, matching a modern corporate aesthetic."
            style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD-FoJSlixUMk5K58ACIx7NS_U7-mjpYZSrR4gnKGqKNrT-lQhbEJOBE1w4eCyaO5YetQRUV9IlUSrUaQxDIs00nvIvM-v6_o1sXW3xcnFDcAwZ-99KvTuzUmyvduk-a92YL2Z999VcHCwW1Bl_WVKFM6eUBNs8FD91wSbcti1mhiF5KJbvE41c7OM0Jn50fcS4nyRbgRQE8GcqjJV46PQYUR--5QJAO7yB0xEGSd_0ljZrWYuSXupkigUNWbeFKEZLcP-4X6AFJqzc')">
        </div>
        <!-- Viewfinder Overlay -->
        <div class="viewfinder-cutout">
            <div class="absolute inset-0 flex flex-col items-center justify-center opacity-20 pointer-events-none"><span
                    class="material-symbols-outlined text-white" style="font-size: 80px;">qr_code_2</span>
                <p class="text-white font-bold text-sm mt-2 uppercase tracking-widest">Scan Area</p>
            </div>
        </div>
        <div class="viewfinder-border">
            <div class="viewfinder-corner corner-tl animate-pulse-soft"></div>
            <div class="viewfinder-corner corner-tr animate-pulse-soft"></div>
            <div class="viewfinder-corner corner-bl animate-pulse-soft"></div>
            <div class="viewfinder-corner corner-br animate-pulse-soft"></div>
            <div class="scan-line"></div>
        </div>
        <!-- Instruction Text Overlay -->
        <div class="absolute top-8 left-0 w-full px-margin-mobile z-50 text-center flex flex-col items-center">
            <div
                class="bg-surface/90 backdrop-blur-sm px-4 py-3 rounded-xl shadow-lg border border-white/20 max-w-[320px]">
                <div class="flex items-center justify-center gap-2 mb-1">
                    <span class="material-symbols-outlined text-anil fill animate-pulse-soft" data-icon="nfc">nfc</span>
                    <span class="material-symbols-outlined text-anil" data-icon="qr_code_scanner">qr_code_scanner</span>
                </div>
                <p class="font-body-md text-body-md text-on-surface">Aproxime o celular da etiqueta NFC ou enquadre o QR
                    Code de projetores, cabos ou chaves</p>
            </div>
        </div>
        <!-- Manual Entry Action -->
        <div class="absolute bottom-24 left-0 w-full px-margin-mobile z-50 flex justify-center pb-safe">
            <button
                class="bg-white/90 backdrop-blur-md text-marinho border border-azul-claro/30 font-label-md text-label-md py-3 px-6 rounded-full shadow-[0_4px_12px_rgba(0,0,0,0.1)] flex items-center gap-2 hover:bg-gelo transition-colors active:scale-95">
                <span class="material-symbols-outlined" data-icon="keyboard">keyboard</span>
                Digitar patrimônio manualmente
            </button>
        </div>
    </main>
    <!-- BottomNavBar (Mobile Only) -->
    <nav
        class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe md:hidden bg-white shadow-[0_-4px_10px_rgba(0,0,0,0.05)] rounded-t-xl">
        <!-- Home -->
        <a class="flex flex-col items-center justify-center text-outline p-2 hover:bg-gelo transition-all rounded-lg"
            href="#">
            <span class="material-symbols-outlined" data-icon="home">home</span>
            <span class="font-label-sm-mobile text-label-sm-mobile mt-1">Home</span>
        </a>
        <!-- Escanear (Active) -->
        <a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full p-2 w-12 h-12 shadow-sm relative -top-3 border-4 border-white active:scale-90 duration-150"
            href="#">
            <span class="material-symbols-outlined fill" data-icon="qr_code_scanner">qr_code_scanner</span>
            <!-- Visually hidden text for accessibility, as the shape implies primary action, but label is required by JSON -->
            <span class="sr-only">Escanear</span>
        </a>
        <!-- Histórico -->
        <a class="flex flex-col items-center justify-center text-outline p-2 hover:bg-gelo transition-all rounded-lg"
            href="#">
            <span class="material-symbols-outlined" data-icon="history">history</span>
            <span class="font-label-sm-mobile text-label-sm-mobile mt-1">Histórico</span>
        </a>
        <!-- Perfil -->
        <a class="flex flex-col items-center justify-center text-outline p-2 hover:bg-gelo transition-all rounded-lg"
            href="#">
            <span class="material-symbols-outlined" data-icon="person">person</span>
            <span class="font-label-sm-mobile text-label-sm-mobile mt-1">Perfil</span>
        </a>
    </nav>


</body>

</html>
